<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objection Drill</title>
  <style>
    body { font-family: Georgia, serif; max-width: 600px; margin: 40px auto; padding: 0 16px; background: #fdfbf7; color: #222; }
    #question { font-size: 1.3em; margin: 24px 0; }
    button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 1em; cursor: pointer; }
    #feedback { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Objection Drill</h1>
  <p id="question"></p>
  <div id="choices"></div>
  <p id="feedback"></p>
  <button id="next" onclick="nextQuestion()">Next question</button>

  <script>
    // ---- STEP 1: THE DATA ----
    // This is like a Python list of dictionaries.
    // In Python: questions = [{"text": "...", "answer": "..."}, ...]
    const questions = [
      { text: "On direct: \"You saw the defendant run out of the store, didn't you?\"", answer: "Leading" },
      { text: "\"What did your neighbor tell you about the fight?\"", answer: "Hearsay" },
      { text: "\"What was the defendant thinking when he left?\"", answer: "Speculation" },
      { text: "\"Isn't it true you were at the bar, and you had five drinks?\"", answer: "Compound" },
      { text: "\"How can you possibly expect the jury to believe that?\"", answer: "Argumentative" }
    ];

    const objections = ["Leading", "Hearsay", "Speculation", "Compound", "Argumentative"];

    let current = 0;   // which question we're on (like an index in Python)

    // ---- STEP 2: SHOW A QUESTION ----
    // A function, just like Python's "def show_question():"
    function showQuestion() {
      const q = questions[current];
      document.getElementById("question").textContent = q.text;
      document.getElementById("feedback").textContent = "";

      const box = document.getElementById("choices");
      box.innerHTML = "";                      // clear old buttons

      for (const name of objections) {         // Python: for name in objections:
        const btn = document.createElement("button");
        btn.textContent = name;
        btn.onclick = function () { checkAnswer(name); };
        box.appendChild(btn);
      }
    }

    // ---- STEP 3: CHECK THE ANSWER ----
    function checkAnswer(choice) {
      const correct = questions[current].answer;
      const feedback = document.getElementById("feedback");
      if (choice === correct) {                // Python: if choice == correct:
        feedback.textContent = "Sustained! Correct: " + correct;
      } else {
        feedback.textContent = "Overruled. The answer was: " + correct;
      }
    }

    // ---- STEP 4: MOVE ON ----
    function nextQuestion() {
      current = (current + 1) % questions.length;   // wraps back to 0 at the end
      showQuestion();
    }

    showQuestion();   // run once when the page loads
  </script>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objection Drill</title>
  <style>
    body { font-family: Georgia, serif; max-width: 640px; margin: 32px auto; padding: 0 16px; background: #fdfbf7; color: #222; }
    #question { font-size: 1.25em; margin: 20px 0; }
    #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }   /* NEW: 2-column buttons */
    button { padding: 12px; font-size: 1em; cursor: pointer; }
    #next { display: block; width: 100%; margin-top: 16px; }
    #feedback { margin-top: 20px; font-weight: bold; }
    #score { color: #666; }
    #missed li { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Objection Drill</h1>
  <p id="score">Score: 0 / 0</p>
  <p id="question"></p>
  <div id="choices"></div>
  <p id="feedback"></p>
  <p id="explain"></p>
  <ul id="missed"></ul>                          <!-- NEW: review list at end of round -->
  <button id="next" onclick="nextQuestion()">Next question</button>

  <script>
    // ---- STEP 1: THE DATA ----
    // To add a question: copy one { ... } block, paste it, edit it, and keep the commas between blocks.
    const questions = [
      // Leading
      { text: "On direct: \"You saw the defendant run out of the store, didn't you?\"",
        answer: "Leading", rule: "FRE 611(c)",
        why: "The question suggests the answer. Leading questions generally aren't allowed on direct." },
      { text: "On direct: \"The light was red when the car entered the intersection, correct?\"",
        answer: "Leading", rule: "FRE 611(c)",
        why: "The attorney is supplying the fact (red light) and asking the witness to agree." },

      // Hearsay
      { text: "\"What did your neighbor tell you about the fight?\"",
        answer: "Hearsay", rule: "FRE 801(c), 802",
        why: "It asks for an out-of-court statement, offered to prove what happened in the fight." },
      { text: "\"What did your coworker tell you the next day about who took the money?\"",
        answer: "Hearsay", rule: "FRE 801(c), 802",
        why: "An out-of-court statement offered to prove who took the money, made a day later, so no obvious exception applies." },

      // Speculation
      { text: "\"What was the defendant thinking when he left?\"",
        answer: "Speculation", rule: "FRE 602",
        why: "The witness has no personal knowledge of what's in someone else's head." },
      { text: "\"Why do you think your boss fired Ms. Lee?\"",
        answer: "Speculation", rule: "FRE 602",
        why: "It asks the witness to guess at another person's motive." },

      // Compound
      { text: "\"Isn't it true you were at the bar, and you had five drinks?\"",
        answer: "Compound", rule: "FRE 611(a)",
        why: "Two questions in one. A single \"yes\" wouldn't tell the jury which part it answers." },
      { text: "\"Did you lock the door and turn on the alarm before you left?\"",
        answer: "Compound", rule: "FRE 611(a)",
        why: "Two separate facts. The witness might have done one but not the other." },

      // Argumentative
      { text: "On cross: \"How can you possibly expect the jury to believe that?\"",
        answer: "Argumentative", rule: "FRE 611(a)",
        why: "It argues with the witness instead of asking for facts." },
      { text: "On cross: \"You're just making this up as you go, aren't you?\"",
        answer: "Argumentative", rule: "FRE 611(a)",
        why: "It attacks the witness rather than asking about a fact. Save that for closing." },

      // Relevance
      { text: "In a car-accident trial: \"What's your favorite sports team?\"",
        answer: "Relevance", rule: "FRE 401, 402",
        why: "It doesn't make any fact of consequence in the case more or less likely." },
      { text: "In a theft trial: \"How many siblings do you have?\"",
        answer: "Relevance", rule: "FRE 401, 402",
        why: "Nothing connects the witness's family size to whether the theft happened." },

      // Narrative
      { text: "On direct: \"Tell the jury everything that happened that whole week.\"",
        answer: "Narrative", rule: "FRE 611(a)",
        why: "It invites a long, open-ended story, so opposing counsel can't object to problems before they come out." },

      // Asked and answered
      { text: "The witness has already said twice that the car was blue. Again: \"What color was the car?\"",
        answer: "Asked and Answered", rule: "FRE 611(a)",
        why: "Repeating a question that's already been answered wastes time and can badger the witness." },

      // Foundation
      { text: "With no questions about it first: \"Your Honor, I move Exhibit 4, a text message, into evidence.\"",
        answer: "Lack of Foundation", rule: "FRE 901",
        why: "No witness has authenticated the exhibit, e.g. who sent it and how they know." },

      // Character evidence
      { text: "Assault trial. The prosecutor asks, before the defense has offered any character evidence: \"What is the defendant's reputation for violence?\"",
        answer: "Improper Character", rule: "FRE 404(a)",
        why: "The prosecution can't use bad character to show the defendant acted that way, unless the defense opens the door first." },

      // Beyond the scope
      { text: "Direct covered only what the witness saw at the crash. On cross: \"Tell us about your business deals with the plaintiff last year.\"",
        answer: "Beyond the Scope", rule: "FRE 611(b)",
        why: "Cross is limited to the subject of direct, plus credibility." },

      // Vague
      { text: "\"Did you see him around then?\"",
        answer: "Vague", rule: "FRE 611(a)",
        why: "\"Him\" and \"around then\" are unclear, so the answer won't mean anything definite." }
    ];

    const objections = ["Leading", "Hearsay", "Speculation", "Compound", "Argumentative",
                        "Relevance", "Narrative", "Asked and Answered", "Lack of Foundation",
                        "Improper Character", "Beyond the Scope", "Vague"];

    // Shuffle the questions (like random.shuffle in Python)
    questions.sort(() => Math.random() - 0.5);

    let current = 0;
    let right = 0;
    let attempts = 0;
    let answered = false;
    let missed = [];     // NEW: an empty list, like missed = [] in Python

    // ---- STEP 2: SHOW A QUESTION ----
    function showQuestion() {
      const q = questions[current];
      document.getElementById("question").textContent =
        "(" + (current + 1) + " of " + questions.length + ") " + q.text;
      document.getElementById("feedback").textContent = "";
      document.getElementById("explain").textContent = "";
      document.getElementById("missed").innerHTML = "";
      document.getElementById("next").textContent = "Next question";
      answered = false;

      const box = document.getElementById("choices");
      box.innerHTML = "";
      for (const name of objections) {
        const btn = document.createElement("button");
        btn.textContent = name;
        btn.onclick = function () { checkAnswer(name); };
        box.appendChild(btn);
      }
    }

    // ---- STEP 3: CHECK THE ANSWER ----
    function checkAnswer(choice) {
      if (answered) return;
      answered = true;
      attempts = attempts + 1;

      const q = questions[current];
      const feedback = document.getElementById("feedback");
      if (choice === q.answer) {
        right = right + 1;
        feedback.textContent = "Sustained! " + q.answer + " (" + q.rule + ")";
      } else {
        feedback.textContent = "Overruled. The answer was " + q.answer + " (" + q.rule + ")";
        missed.push(q);  // NEW: push = Python's append
      }
      document.getElementById("explain").textContent = q.why;
      document.getElementById("score").textContent = "Score: " + right + " / " + attempts;
    }

    // ---- STEP 4: MOVE ON ----
    function nextQuestion() {
      current = current + 1;
      if (current < questions.length) {
        showQuestion();
      } else {
        endRound();
      }
    }

    // ---- STEP 5: END OF ROUND ----
    function endRound() {
      document.getElementById("question").textContent =
        "Round over! You got " + right + " out of " + questions.length + ".";
      document.getElementById("choices").innerHTML = "";
      document.getElementById("feedback").textContent =
        missed.length > 0 ? "Review the ones you missed:" : "Perfect round!";
      document.getElementById("explain").textContent = "";

      // NEW: list each missed question with its answer
      const list = document.getElementById("missed");
      list.innerHTML = "";
      for (const q of missed) {
        const item = document.createElement("li");
        item.textContent = q.text + " → " + q.answer + " (" + q.rule + ")";
        list.appendChild(item);
      }

      // Reset for the next round
      questions.sort(() => Math.random() - 0.5);
      current = -1;
      right = 0;
      attempts = 0;
      missed = [];
      document.getElementById("score").textContent = "Score: 0 / 0";
      document.getElementById("next").textContent = "Play again";
    }

    showQuestion();
  </script>
</body>

<body>

 {
  "n": 1,
  "stem": "While driving to work, a woman was rear-ended when she pulled up to a stoplight. The woman suffered serious injuries to her neck, and she was forced to miss several months of work. She sued the driver of the other vehicle for damages resulting from her physical injuries and loss of income. At trial, the woman’s attorney calls the defendant’s coworker to the stand. In response to an unrelated question, the coworker testifies that the defendant is careless when he drives. The defendant’s attorney objects and moves to strike the testimony.\n\nThe motion to strike should be",
  "choices": [
   "granted since the testimony suggests a propensity and is unduly prejudicial.",
   "granted because the testimony is irrelevant.",
   "denied because the objection was late.",
   "denied because propensity evidence is admissible when character is at issue."
  ],
  "answer": 0,
  "rule": "FRE 404(a)(1)",
  "why": "Testimony that the defendant is a careless driver is character evidence offered to show he acted carelessly this time. That's barred propensity evidence, and character isn't an element of a negligence claim.",
  "check": null
 },
 {
  "n": 2,
  "stem": "A plaintiff sued a defendant for battery. The plaintiff and the defendant were in a barroom altercation, during which the defendant punched the plaintiff in the chest. Prior to trial, the defendant concedes the plaintiff’s damages, and only contests liability. At trial, the plaintiff’s attorney attempts to introduce pictures of the plaintiff’s injuries. The defense attorney objects.\n\nUnder California law, the proffered evidence should be",
  "choices": [
   "excluded because it is irrelevant.",

  "answer": 0,

  "check": "California-specific. Under the FRE, conceded facts can still be relevant (403 does the work instead)."
 },
 {
  "n": 3,
  "stem": "A defendant was charged with possession of a controlled substance with intent to sell. The defendant denies that he possessed a controlled substance. At trial, during its case-in-chief, the prosecution proffers evidence that the defendant was previously convicted in federal court of selling a controlled substance in interstate commerce. Defense counsel objects.\n\nThe trial court should",
  "choices": [
   "overrule the objection because the evidence has probative value.",

  "check": null
 },
 {
  "n": 4,
  "stem": "A man was injured while riding a rollercoaster. The man sued the ride’s operator, claiming that she failed to properly secure his over-the-shoulder restraint. The operator filed a third-party complaint against the rollercoaster’s manufacturer, alleging a product defect. At trial, the operator plans to introduce video footage from a security camera. The operator makes an offer of proof, claiming that the footage shows that on the 50 occasions leading up to the accident, she properly fastened riders’ restraints and double-checked that they were secure. The video cuts out just as the man is boarding the ride, and thus does not confirm if the operator properly secured the man’s restraint on the subject occasion.\n\nThe video footage should be",

 {

 {

  "stem": "A judge attended a local men’s club meeting. In introducing the judge to the club’s members, the club president said, “Gentlemen, I take great pleasure in presenting the judge, who we all know is the best judge money can buy!”\n\nThe judge sued the club president for slander. If the club president pleads truth as a defense, he may NOT properly introduce evidence to show",

 },

  "n": 13,
  "stem": "A woman is charged with tax fraud. She wishes to offer evidence that she was honest while she was running for mayor. During her political campaign, the woman refused to lie about a psychiatric problem that she had endured in the past, and her honesty cost her the election. The woman was quoted as saying, “If I had lied, I would be mayor today; but that is no way to win an election.”\n\nIf the prosecutor objects, what is the BEST argument he can make to the judge?",

    let questions = allQuestions.slice();   // the set we're playing (like list(...) in Python)
    let current = 0, right = 0, attempts = 0, answered = false, missed = [];
    const letters = ["A", "B", "C", "D"];

    function el(id) { return document.getElementById(id); }

    function showQuestion() {
      const q = questions[current];
      el("progress").textContent = "Question " + q.n + "  (" + (current + 1) + " of " + questions.length + ")";
      el("stem").textContent = q.stem;
      el("feedback").textContent = "";
      el("explain").textContent = "";
      el("check").style.display = "none";
      el("missed").innerHTML = "";
      el("retry").style.display = "none";
      el("next").textContent = "Next question";
      answered = false;

      const box = el("choices");
      box.innerHTML = "";
      q.choices.forEach(function (text, i) {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = letters[i] + ". " + text;
        btn.onclick = function () { checkAnswer(i); };
        box.appendChild(btn);
      });
    }

    function checkAnswer(i) {
      if (answered) return;
      answered = true;
      attempts++;
      const q = questions[current];
      const buttons = el("choices").children;
      buttons[q.answer].classList.add("right");
      if (i === q.answer) {
        right++;
        el("feedback").textContent = "Correct: " + letters[q.answer] + "  (" + q.rule + ")";
      } else {
        buttons[i].classList.add("wrong");
        el("feedback").textContent = "Not quite. The answer is " + letters[q.answer] + "  (" + q.rule + ")";
        missed.push(q);
      }
      el("explain").textContent = q.why;
      if (q.check) { el("check").textContent = "Double-check: " + q.check; el("check").style.display = "block"; }
      el("score").textContent = "Score: " + right + " / " + attempts;
    }

    function nextQuestion() {
      current++;
      if (current < questions.length) showQuestion(); else endRound();
    }

    function endRound() {
      el("progress").textContent = "";
      el("stem").textContent = "Round over! You got " + right + " out of " + questions.length + ".";
      el("choices").innerHTML = "";
      el("explain").textContent = "";
      el("check").style.display = "none";
      el("feedback").textContent = missed.length ? "Review the ones you missed:" : "Perfect round!";
      const list = el("missed");
      list.innerHTML = "";
      for (const q of missed) {
        const li = document.createElement("li");
        li.textContent = "Q" + q.n + ": " + letters[q.answer] + " (" + q.rule + "). " + q.why;
        list.appendChild(li);
      }
      el("retry").style.display = missed.length ? "block" : "none";
      el("next").textContent = "Start over (all 32)";
      el("next").onclick = function () { startRound(allQuestions.slice()); };
    }

    function retryMissed() { startRound(missed.slice()); }

    function startRound(set) {
      questions = set;
      current = 0; right = 0; attempts = 0; missed = [];
      el("score").textContent = "Score: 0 / 0";
      el("next").onclick = nextQuestion;
      showQuestion();
    }

    showQuestion();
  </script>
</body>
